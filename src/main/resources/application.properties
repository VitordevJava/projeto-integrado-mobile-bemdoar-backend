# ============================================================
# BemDoar - configuracao do backend
# ============================================================

spring.application.name=bemdoar
server.port=8080

# ---- BANCO DE DADOS (H2 em arquivo) ------------------------
# O banco nasce sozinho na pasta ./data quando voce roda o projeto.
# NAO precisa instalar nada.
spring.datasource.url=jdbc:h2:file:./data/bemdoar;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console visual do banco desabilitado (dados de doadores).
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ---- JPA / HIBERNATE ---------------------------------------
# update = o Hibernate cria/atualiza as tabelas a partir das @Entity.
# Ninguem escreve SQL de migration neste projeto.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- SEGURANCA / JWT ---------------------------------------
# Chave usada para assinar o token. Em trabalho academico pode ficar aqui.
bemdoar.jwt.secret=bemdoar-chave-secreta-academica-nao-usar-em-producao-2026
# Validade do token em milissegundos (8 horas)
bemdoar.jwt.expiracao=28800000

# ---- FRONTEND AUTORIZADO (CORS) ----------------------------
bemdoar.cors.origem=http://localhost:5173

